            /* ============================================================
     DESIGN SYSTEM — Exact match of existing RTOS app tokens
     ============================================================ */
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                /* Fonts */
                --font-sans: "Plus Jakarta Sans", "Inter", ui-sans-serif, system-ui, sans-serif;
                --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;

                /* Light theme - exact oklch values from app.css */
                --bg: oklch(1 0 0);
                --fg: oklch(0.21 0.006 285.885);
                --primary: oklch(0.546 0.245 262.881);
                --primary-fg: oklch(1 0 0);
                --primary-subtle: oklch(0.623 0.214 259.815 / 0.15);
                --primary-subtle-fg: oklch(0.488 0.243 264.376);
                --secondary: oklch(0.92 0.004 286.32);
                --secondary-fg: oklch(0.141 0.005 285.823);
                --muted: oklch(0.967 0.001 286.375);
                --muted-fg: oklch(0.552 0.016 285.938);
                --success: oklch(0.596 0.145 163.225);
                --success-fg: oklch(1 0 0);
                --success-subtle: oklch(0.696 0.17 162.48 / 0.15);
                --warning: oklch(0.828 0.189 84.429);
                --warning-fg: oklch(0.279 0.077 45.635);
                --warning-subtle: oklch(0.828 0.189 84.429 / 0.2);
                --danger: oklch(0.577 0.245 27.325);
                --danger-fg: oklch(0.971 0.013 17.38);
                --danger-subtle: oklch(0.637 0.237 25.331 / 0.15);
                --border: oklch(0.911 0.006 286.286);
                --input: oklch(0.871 0.006 286.286);
                --ring: oklch(0.546 0.245 262.881);
                --sidebar: oklch(0.985 0 0);
                --sidebar-fg: oklch(0.141 0.005 285.823);
                --sidebar-primary: oklch(0.623 0.214 259.815 / 0.15);
                --sidebar-border: oklch(0.901 0.006 286.286);
                --navbar: oklch(0.995 0 0);
                --navbar-fg: oklch(0.141 0.005 285.823);
                --overlay: oklch(1 0 0);
                --overlay-fg: oklch(0.141 0.005 285.823);

                /* Radius */
                --radius-lg: 0.5rem;
                --radius-xs: calc(var(--radius-lg) * 0.5);
                --radius-sm: calc(var(--radius-lg) * 0.75);
                --radius-md: calc(var(--radius-lg) * 0.9);
                --radius-xl: calc(var(--radius-lg) * 1.25);
                --radius-2xl: calc(var(--radius-lg) * 1.5);
                --radius-3xl: calc(var(--radius-lg) * 2);
                --radius-4xl: calc(var(--radius-lg) * 3);

                /* Shadows */
                --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.03);
                --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
                --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.06), 0 4px 6px -4px rgb(0 0 0 / 0.04);
                --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.06), 0 8px 10px -6px rgb(0 0 0 / 0.04);
            }

            .dark {
                --bg: oklch(0.181 0.005 285.823);
                --fg: oklch(0.985 0 0);
                --primary: oklch(0.546 0.245 262.881);
                --primary-fg: oklch(1 0 0);
                --primary-subtle: oklch(0.623 0.214 259.815 / 0.1);
                --primary-subtle-fg: oklch(0.707 0.165 254.624);
                --secondary: oklch(0.244 0.006 286.033);
                --secondary-fg: oklch(0.985 0 0);
                --muted: oklch(0.21 0.006 285.885);
                --muted-fg: oklch(0.705 0.015 286.067);
                --border: oklch(0.342 0.017 285.786);
                --input: oklch(0.32 0.013 285.805);
                --sidebar: oklch(0.21 0.006 285.885);
                --sidebar-fg: oklch(0.985 0 0);
                --sidebar-primary: oklch(0.623 0.214 259.815 / 0.1);
                --sidebar-border: oklch(0.274 0.006 286.033);
                --navbar: oklch(0.19 0.006 285.885);
                --navbar-fg: oklch(0.985 0 0);
                --overlay: oklch(0.21 0.006 285.885);
                --overlay-fg: oklch(0.985 0 0);
                --success-subtle: oklch(0.696 0.17 162.48 / 0.1);
                --warning-subtle: oklch(0.828 0.189 84.429 / 0.1);
                --danger-subtle: oklch(0.637 0.237 25.331 / 0.1);
                --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.2);
                --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.25);
                --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.3);
                --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.3);
            }

            html {
                font-family: var(--font-sans);
                -webkit-font-smoothing: antialiased;
            }
            body {
                background: var(--bg);
                color: var(--fg);
                line-height: 1.6;
                overflow: hidden;
                height: 100vh;
            }
            #root {
                height: 100vh;
                display: flex;
            }

            /* Scrollbar styling */
            ::-webkit-scrollbar {
                width: 4px;
                height: 4px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            ::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 4px;
            }
            * {
                scrollbar-width: thin;
                scrollbar-color: var(--border) transparent;
            }

            .ti {
                font-size: 1.25rem;
                vertical-align: middle;
            }
        </style>
    </head>

                                                        ? "var(--muted-fg)"

                                                fontSize: 12,
                                                fontWeight: 500,
                                                cursor: page === totalPages ? "default" : "pointer",

                                                alignItems: "center",

                                                className="ti ti-chevron-right"

                                            />
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>

                );
            }

            {
                /* ============================================================
     PAGE: CATEGORY FORM (shared between Create & Edit)
     ============================================================ */
            }
            function CategoryFormPage({ mode }) {
                const { navigate } = useContext(AppContext);
                const isEdit = mode === "edit";

                        : "",
                });

                function handleChange(field, value) {
                    setFormData((prev) => ({ ...prev, [field]: value }));
                }

                return (
                    <div style={{ flex: 1, overflowY: "auto", padding: "24px" }}>
                        <div
                            style={{
                                maxWidth: 1000,
                                display: "flex",
                                flexDirection: "column",
                                gap: 20,
                            }}

                            {/* Back link */}

                                onClick={() => navigate("categories")}
                                style={{
                                    display: "inline-flex",
                                    alignItems: "center",
                                    gap: 6,

                                    color: "var(--muted-fg)",
                                    cursor: "pointer",
                                    transition: "color 0.15s",
                                    width: "fit-content",
                                }}
                                onMouseEnter={(e) => {
                                    e.currentTarget.style.color = "var(--primary)";
                                }}
                                onMouseLeave={(e) => {
                                    e.currentTarget.style.color = "var(--muted-fg)";

                                <i className="ti ti-arrow-left" style={{ fontSize: 16 }} />

                            <div
                                style={{
                                    display: "grid",

                                    alignItems: "start",

                                <div

                                        borderRadius: 16,
                                        border: "1px solid var(--border)",
                                        background: "var(--overlay)",
                                        padding: "20px",
                                    }}
                                >
                                    <div
                                        style={{
                                            display: "flex",
                                            alignItems: "center",
                                            gap: 10,
                                            marginBottom: 16,
                                        }}

                                        <div
                                            style={{
                                                width: 28,
                                                height: 28,

                                                background: "var(--primary-subtle)",

                                            }}

                                            <i

                                        </div>
                                        <span
                                            style={{
                                                fontSize: 13,
                                                fontWeight: 600,
                                                color: "var(--fg)",
                                            }}
                                        >
                                            Gambar Kategori
                                        </span>
                                    </div>

                                    {/* Upload area */}
                                    <div
                                        style={{
                                            aspectRatio: "1/1",
                                            borderRadius: 12,
                                            border: "2px dashed var(--input)",
                                            background: imagePreview
                                                ? "transparent"
                                                : "var(--muted)",
                                            display: "flex",
                                            alignItems: "center",
                                            justifyContent: "center",
                                            overflow: "hidden",
                                            marginBottom: 12,
                                            position: "relative",
                                            transition: "border-color 0.2s",
                                        }}
                                        onMouseEnter={(e) => {
                                            if (!imagePreview)
                                                e.currentTarget.style.borderColor = "var(--ring)";
                                        }}
                                        onMouseLeave={(e) => {
                                            e.currentTarget.style.borderColor = "var(--input)";
                                        }}
                                    >
                                        {imagePreview ? (
                                            <img
                                                src={imagePreview}
                                                alt="Preview"
                                                style={{
                                                    width: "100%",
                                                    height: "100%",
                                                    objectFit: "cover",

                                        ) : (
                                            <div style={{ textAlign: "center", padding: 20 }}>
                                                <i
                                                    className="ti ti-cloud-upload"

                                                        fontSize: 40,

                                                        marginBottom: 8,
                                                        display: "block",
                                                    }}
                                                />
                                                <p
                                                    style={{
                                                        fontSize: 12,
                                                        color: "var(--muted-fg)",
                                                    }}
                                                >
                                                    Klik atau taruh file di sini
                                                </p>
                                                <p
                                                    style={{
                                                        fontSize: 10,
                                                        color: "var(--muted-fg)",
                                                        marginTop: 4,
                                                    }}
                                                >
                                                    PNG, JPG, WebP (max 2MB)
                                                </p>
                                            </div>

                                    {/* Upload button */}
                                    <label
                                        style={{
                                            display: "flex",
                                            alignItems: "center",
                                            justifyContent: "center",
                                            gap: 8,
                                            padding: "8px 16px",
                                            borderRadius: 10,
                                            border: "1px solid var(--border)",
                                            fontSize: 12,
                                            fontWeight: 500,
                                            color: "var(--fg)",
                                            cursor: "pointer",
                                            transition: "background 0.15s",
                                            width: "100%",
                                        }}
                                        onMouseEnter={(e) => {
                                            e.currentTarget.style.background = "var(--muted)";
                                        }}
                                        onMouseLeave={(e) => {
                                            e.currentTarget.style.background = "transparent";

                                        />
                                    </label>
                                    {isEdit && (
                                        <div style={{ marginTop: 8, display: "flex", gap: 8 }}>
                                            <label
                                                style={{
                                                    flex: 1,
                                                    display: "flex",
                                                    alignItems: "center",
                                                    justifyContent: "center",
                                                    gap: 6,
                                                    padding: "6px 12px",
                                                    borderRadius: 8,
                                                    border: "1px solid var(--danger-subtle)",
                                                    fontSize: 11,
                                                    fontWeight: 500,
                                                    color: "var(--danger)",
                                                    cursor: "pointer",
                                                }}
                                            >
                                                <i
                                                    className="ti ti-trash"

                                                />
                                                Hapus
                                                <input
                                                    type="checkbox"
                                                    style={{ display: "none" }}
                                                />
                                            </label>
                                        </div>
                                    )}
                                </div>

                                {/* Right: Form */}
                                <div
                                    style={{
                                        borderRadius: 16,
                                        border: "1px solid var(--border)",
                                        background: "var(--overlay)",
                                        padding: "20px",

                                >

                                            <div
                                                style={{
                                                    width: 28,
                                                    height: 28,
                                                    borderRadius: 8,
                                                    background: "var(--primary-subtle)",
                                                    display: "flex",
                                                    alignItems: "center",
                                                    justifyContent: "center",
                                                }}
                                            >
                                                <i
                                                    className="ti ti-info-circle"
                                                    style={{
                                                        fontSize: 14,
                                                        color: "var(--primary)",
                                                    }}
                                                />
                                            </div>
                                            <span
                                                style={{
                                                    fontSize: 14,
                                                    fontWeight: 600,
                                                    color: "var(--fg)",
                                                }}
                                            >
                                                Informasi Kategori
                                            </span>
                                        </div>
                                        <p
                                            style={{
                                                fontSize: 12,
                                                color: "var(--muted-fg)",
                                                marginLeft: 38,
                                            }}
                                        >
                                            Isi detail kategori produk
                                        </p>
                                    </div>

                                    {/* Name field */}
                                    <div>
                                        <label
                                            style={{
                                                display: "block",
                                                fontSize: 12,
                                                fontWeight: 600,
                                                color: "var(--fg)",
                                                marginBottom: 6,
                                            }}
                                        >
                                            Nama Kategori{" "}
                                            <span style={{ color: "var(--danger)" }}>*</span>
                                        </label>
                                        <input
                                            type="text"
                                            value={formData.name}
                                            onChange={(e) => handleChange("name", e.target.value)}
                                            placeholder="Masukkan nama kategori"
                                            style={{
                                                width: "100%",
                                                padding: "10px 14px",
                                                borderRadius: 10,
                                                border: "1px solid var(--input)",
                                                background: "var(--overlay)",
                                                color: "var(--fg)",
                                                fontSize: 13,
                                                outline: "none",
                                                transition: "border-color 0.2s, box-shadow 0.2s",
                                            }}
                                            onFocus={(e) => {
                                                e.currentTarget.style.borderColor = "var(--ring)";
                                                e.currentTarget.style.boxShadow =
                                                    "0 0 0 3px color-mix(in oklab, var(--ring) 15%, transparent)";
                                            }}
                                            onBlur={(e) => {
                                                e.currentTarget.style.borderColor = "var(--input)";
                                                e.currentTarget.style.boxShadow = "none";
                                            }}
                                        />
                                        {!formData.name && (
                                            <p
                                                style={{
                                                    fontSize: 11,
                                                    color: "var(--muted-fg)",
                                                    marginTop: 4,
                                                }}
                                            >
                                                Nama akan ditampilkan di halaman kategori
                                            </p>
                                        )}
                                    </div>

                                    {/* Description field */}
                                    <div>
                                        <label
                                            style={{
                                                display: "block",
                                                fontSize: 12,
                                                fontWeight: 600,
                                                color: "var(--fg)",
                                                marginBottom: 6,
                                            }}
                                        >
                                            Deskripsi{" "}
                                            <span
                                                style={{
                                                    color: "var(--muted-fg)",
                                                    fontWeight: 400,
                                                }}
                                            >
                                                (opsional)
                                            </span>
                                        </label>
                                        <textarea
                                            value={formData.description}
                                            onChange={(e) =>
                                                handleChange("description", e.target.value)
                                            }
                                            placeholder="Deskripsi kategori"
                                            rows={4}
                                            style={{
                                                width: "100%",
                                                padding: "10px 14px",
                                                borderRadius: 10,
                                                border: "1px solid var(--input)",
                                                background: "var(--overlay)",
                                                color: "var(--fg)",
                                                fontSize: 13,
                                                resize: "vertical",
                                                outline: "none",
                                                transition: "border-color 0.2s, box-shadow 0.2s",
                                                fontFamily: "inherit",
                                            }}
                                            onFocus={(e) => {
                                                e.currentTarget.style.borderColor = "var(--ring)";
                                                e.currentTarget.style.boxShadow =
                                                    "0 0 0 3px color-mix(in oklab, var(--ring) 15%, transparent)";
                                            }}
                                            onBlur={(e) => {
                                                e.currentTarget.style.borderColor = "var(--input)";
                                                e.currentTarget.style.boxShadow = "none";
                                            }}
                                        />
                                    </div>

                                    {/* Separator */}
                                    <div style={{ height: 1, background: "var(--border)" }} />

                                    {/* Action buttons */}
                                    <div
                                        style={{
                                            display: "flex",
                                            justifyContent: "flex-end",
                                            gap: 10,
                                        }}
                                    >
                                        <div
                                            onClick={() => navigate("categories")}
                                            style={{
                                                padding: "10px 20px",
                                                borderRadius: 10,
                                                border: "1px solid var(--border)",
                                                fontSize: 13,
                                                fontWeight: 500,
                                                color: "var(--fg)",
                                                cursor: "pointer",
                                                transition: "background 0.15s",
                                            }}
                                            onMouseEnter={(e) => {
                                                e.currentTarget.style.background = "var(--muted)";
                                            }}
                                            onMouseLeave={(e) => {
                                                e.currentTarget.style.background = "transparent";
                                            }}
                                        >
                                            Batal
                                        </div>
                                        <div
                                            style={{
                                                display: "inline-flex",
                                                alignItems: "center",
                                                gap: 8,
                                                padding: "10px 24px",
                                                borderRadius: 10,

                                                fontSize: 13,
                                                fontWeight: 600,
                                                cursor: "pointer",
                                                transition: "opacity 0.15s",
                                                boxShadow:
                                                    "0 2px 8px color-mix(in oklab, var(--primary) 30%, transparent)",
                                            }}
                                            onMouseEnter={(e) => {
                                                e.currentTarget.style.opacity = "0.9";
                                            }}
                                            onMouseLeave={(e) => {
                                                e.currentTarget.style.opacity = "1";
                                            }}
                                        >
                                            <i
                                                className="ti ti-device-floppy"

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            {
                /* ============================================================
     APP ROOT
     ============================================================ */
            }
            function App() {
                const [currentPage, setCurrentPage] = useState("dashboard");
                const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
                const [theme, setTheme] = useState(() => {
                    if (typeof document !== "undefined") {
                        return document.documentElement.getAttribute("data-theme") || "light";
                    }
                    return "light";
                });

                useEffect(() => {
                    document.documentElement.setAttribute("data-theme", theme);
                    if (theme === "dark") {
                        document.documentElement.classList.add("dark");
                    } else {
                        document.documentElement.classList.remove("dark");
                    }
                }, [theme]);

                function toggleTheme() {
                    setTheme((t) => (t === "dark" ? "light" : "dark"));
                }

                function navigate(page) {
                    setCurrentPage(page);
                }

                function renderPage() {
                    switch (currentPage) {
                        case "dashboard":
                            return <DashboardPage />;
                        case "categories":
                            return <CategoriesIndexPage />;
                        case "categories-create":
                            return <CategoryFormPage mode="create" />;
                        case "categories-edit":
                            return <CategoryFormPage mode="edit" />;
                        default:
                            return <DashboardPage />;
                    }
                }

                return (
                    <AppContext.Provider value={{ currentPage, navigate, theme, toggleTheme }}>
                        <div
                            style={{
                                display: "flex",
                                height: "100vh",
                                width: "100vw",
                                overflow: "hidden",
                                background: "var(--bg)",
                            }}
                        >
                            <Sidebar
                                collapsed={sidebarCollapsed}
                                onToggleCollapse={() => setSidebarCollapsed((c) => !c)}
                            />
                            <div
                                style={{
                                    display: "flex",
                                    flexDirection: "column",
                                    flex: 1,
                                    minWidth: 0,
                                }}
                            >
                                <Header />
                                {renderPage()}
                            </div>
                        </div>
                        {/* Version badge */}
                        <div
                            style={{
                                position: "fixed",
                                bottom: 8,
                                right: 8,
                                fontSize: 10,
                                color: "var(--muted-fg)",
                                opacity: 0.5,
                                fontFamily: "var(--font-mono)",
                            }}
                        >
                            RTOS Redesign · Prototype v1
                        </div>
                    </AppContext.Provider>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById("root"));
            root.render(<App />);
        </script>
    </body>
</html>
