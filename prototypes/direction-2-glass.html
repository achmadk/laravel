        <!--
  DESIGNER'S NOTES — Direction #2: Ambient Glass
  Philosophy: Field.io Motion Poetics
  Designer/Studio reference: Field.io — generative & immersive digital experiences
  
  KEY ASSUMPTIONS:
  1. Glassmorphism (backdrop-filter blur + semi-transparent backgrounds) as the core visual language.
  2. Dark mode is the hero — deep gradient background with floating glass panels.
  3. Light mode uses crisp translucent overlays with subtle shadows.
  4. The brand blue primary appears as a glow/ambient effect behind glass elements.
  5. Micro-animations (entrance stagger, hover glow, button pulse) are integral.
  6. ALL 3 pages share the same glass grammar — index cards, form panels, sidebar all use frosted glass.
  
  WHY THIS WORKS FOR RTOS:
  - An Indonesian e-commerce admin panel that feels premium and modern.
  - Glassmorphism signals "premium tech" without being gimmicky when executed with restraint.
  - The dark gradient background makes the categories cards feel like they're floating in space.
  
  PLACEHOLDERS:
  - Category images use Unsplash sourced URLs
  - Search and pagination are visual-only
  - Form submission is not functional
  - Animations use CSS transitions + keyframes (no external lib)
-->

            *,

                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --primary: oklch(0.546 0.245 262.881);
                --primary-fg: #fff;
                --primary-glow: rgba(67, 127, 236, 0.25);
                --primary-subtle: oklch(0.68 0.17 262.881);
                --danger: oklch(0.6 0.2 25);
                --success: oklch(0.6 0.18 145);

                --bg-end: oklch(0.95 0.01 270);
                --fg: oklch(0.181 0.005 285.823);
                --muted-fg: oklch(0.5 0.01 285.823);
                --glass-bg: rgba(255, 255, 255, 0.65);
                --glass-border: rgba(255, 255, 255, 0.4);
                --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
                --sidebar-glass: rgba(255, 255, 255, 0.55);
                --sidebar-border: rgba(255, 255, 255, 0.25);
                --input-bg: rgba(255, 255, 255, 0.5);
                --radius: 16px;
                --radius-sm: 10px;
            }

            [data-theme="dark"] {
                --bg-start: oklch(0.1 0.01 280);
                --bg-end: oklch(0.16 0.03 260);
                --fg: oklch(1 0 0);
                --muted-fg: oklch(0.65 0.01 285.823);
                --glass-bg: rgba(20, 22, 35, 0.6);
                --glass-border: rgba(255, 255, 255, 0.08);
                --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
                --sidebar-glass: rgba(12, 14, 25, 0.7);
                --sidebar-border: rgba(255, 255, 255, 0.06);
                --input-bg: rgba(255, 255, 255, 0.06);
                --primary-glow: rgba(67, 127, 236, 0.4);
            }

            @keyframes floatIn {
                from {
                    opacity: 0;
                    transform: translateY(16px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes shimmer {
                0% {
                    background-position: -200% center;
                }
                100% {
                    background-position: 200% center;
                }
            }

            @keyframes glowPulse {
                0%,
                100% {
                    box-shadow: 0 0 12px var(--primary-glow);
                }
                50% {
                    box-shadow:
                        0 0 24px var(--primary-glow),
                        0 0 48px var(--primary-glow);
                }
            }

            html {
                font-family: "Plus Jakarta Sans", "Inter", ui-sans-serif, system-ui, sans-serif;
                color: var(--fg);
            }
            body {
                margin: 0;
                overflow: hidden;
                height: 100vh;
            }
            #root {
                height: 100vh;
                display: flex;
            }

            ::-webkit-scrollbar {
                width: 5px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            ::-webkit-scrollbar-thumb {
                background: rgba(255, 255, 255, 0.15);
                border-radius: 3px;
            }

            .glass {
                background: var(--glass-bg);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid var(--glass-border);
                box-shadow: var(--glass-shadow);
            }

            .glass-card {
                background: var(--glass-bg);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid var(--glass-border);
                box-shadow: var(--glass-shadow);
                border-radius: var(--radius);
                transition:
                    transform 0.2s ease,
                    box-shadow 0.2s ease;
            }

            .glass-card:hover {
                transform: translateY(-2px);
                box-shadow:
                    0 12px 40px rgba(0, 0, 0, 0.1),
                    0 0 20px var(--primary-glow);
            }

            input,
            textarea,
            button {
                font-family: inherit;
            }
        </style>

                                height: 40,
                                borderRadius: "var(--radius-sm)",
                                color: viewMode === "list" ? "var(--primary)" : "var(--muted-fg)",
                                cursor: "pointer",
                                border: "1px solid var(--glass-border)",
                                transition: "all 0.2s",
                            }}
                        >
                            {I.list}
                        </button>
                    </div>
                );
            }

            // ─── CATEGORY CARD ──────────────────────────────────────
            function GlassCard({ cat, viewMode, index }) {
                const delay = index * 0.06;
                const animStyle = { animation: `floatIn 0.5s ease ${delay}s both` };

                if (viewMode === "list") {
                    return (
                        <div
                            className="glass-card"
                            style={{
                                display: "flex",
                                alignItems: "center",
                                gap: 16,
                                padding: "14px 18px",
                                ...animStyle,
                            }}
                        >
                            <img
                                src={cat.image}
                                alt={cat.name}
                                style={{
                                    width: 46,
                                    height: 46,
                                    borderRadius: "var(--radius-sm)",
                                    objectFit: "cover",
                                    flexShrink: 0,
                                }}
                            />
                            <div style={{ flex: 1 }}>
                                <div style={{ fontSize: 15, fontWeight: 600, color: "var(--fg)" }}>
                                    {cat.name}
                                </div>
                                <div
                                    style={{ fontSize: 13, color: "var(--muted-fg)", marginTop: 2 }}
                                >
                                    {cat.desc}
                                </div>
                            </div>
                            <div
                                style={{
                                    fontSize: 12,
                                    fontWeight: 600,
                                    color: "var(--primary)",
                                    background: "rgba(67, 127, 236, 0.1)",
                                    padding: "4px 12px",
                                    borderRadius: 20,
                                    border: "1px solid rgba(67, 127, 236, 0.15)",
                                }}
                            >
                                {cat.productCount} produk
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="glass-card" style={{ overflow: "hidden", ...animStyle }}>
                        <div style={{ position: "relative" }}>
                            <img
                                src={cat.image}
                                alt={cat.name}
                                style={{
                                    width: "100%",
                                    aspectRatio: "1",
                                    objectFit: "cover",
                                    display: "block",
                                }}
                            />
                            <div
                                style={{
                                    position: "absolute",
                                    inset: 0,
                                    background:
                                        "linear-gradient(to top, rgba(0,0,0,0.4) 0%, transparent 50%)",
                                }}
                            />
                            <div
                                style={{
                                    position: "absolute",
                                    bottom: 12,
                                    left: 12,
                                    right: 12,
                                    padding: "6px 12px",
                                    borderRadius: 20,
                                    background: "rgba(0,0,0,0.5)",
                                    backdropFilter: "blur(8px)",
                                    color: "#fff",
                                    fontSize: 12,
                                    fontWeight: 600,
                                    textAlign: "center",
                                }}
                            >
                                {cat.productCount} produk
                            </div>
                        </div>
                        <div style={{ padding: "14px 16px" }}>
                            <div style={{ fontSize: 15, fontWeight: 600, color: "var(--fg)" }}>
                                {cat.name}
                            </div>
                            <div style={{ fontSize: 13, color: "var(--muted-fg)", marginTop: 3 }}>
                                {cat.desc}
                            </div>
                        </div>
                    </div>
                );
            }

            // ─── PAGINATION ─────────────────────────────────────────
            function GlassPagination({ current }) {
                const wrap = {
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    gap: 6,
                    marginTop: 28,
                    paddingTop: 20,
                    borderTop: "1px solid var(--glass-border)",
                };
                const btn = (active) => ({
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    minWidth: 36,
                    height: 36,
                    borderRadius: "var(--radius-sm)",
                    background: active ? "rgba(67, 127, 236, 0.2)" : "transparent",
                    backdropFilter: active ? "blur(8px)" : "none",
                    border: active
                        ? "1px solid rgba(67, 127, 236, 0.2)"
                        : "1px solid var(--glass-border)",
                    color: active ? "var(--primary)" : "var(--fg)",
                    fontSize: 13,
                    fontWeight: active ? 600 : 400,
                    cursor: "pointer",
                    padding: "0 12px",
                    transition: "all 0.2s",
                });
                return (
                    <div style={wrap}>
                        <button style={btn(false)}>{I.chevL} Sebelumnya</button>
                        {[1, 2, 3].map((n) => (
                            <button key={n} style={btn(n === current)}>
                                {n}
                            </button>
                        ))}
                        <span style={{ fontSize: 13, color: "var(--muted-fg)", margin: "0 12px" }}>
                            menampilkan 1-8 dari 8
                        </span>
                        <button style={btn(false)}>Selanjutnya {I.chevR}</button>
                    </div>
                );
            }

            // ─── INDEX ──────────────────────────────────────────────
            function IndexPage({ onAdd }) {
                const [search, setSearch] = useState("");
                const [view, setView] = useState("grid");
                const filtered = CATEGORIES.filter((c) =>
                    c.name.toLowerCase().includes(search.toLowerCase()),
                );

                return (
                    <div>
                        <GlassHeader title="Kategori" onAdd={onAdd} />
                        <GlassSearch
                            value={search}
                            onChange={(e) => setSearch(e.target.value)}
                            viewMode={view}
                            onViewChange={setView}
                        />
                        <div style={{ fontSize: 13, color: "var(--muted-fg)", marginBottom: 16 }}>
                            {filtered.length} kategori
                        </div>
                        {view === "grid" ? (
                            <div
                                style={{
                                    display: "grid",
                                    gridTemplateColumns: "repeat(auto-fill, minmax(210px, 1fr))",
                                    gap: 18,
                                }}
                            >
                                {filtered.map((cat, i) => (
                                    <GlassCard key={cat.id} cat={cat} viewMode="grid" index={i} />
                                ))}
                            </div>
                        ) : (
                            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                                {filtered.map((cat, i) => (
                                    <GlassCard key={cat.id} cat={cat} viewMode="list" index={i} />
                                ))}
                            </div>
                        )}
                        <GlassPagination current={1} />
                    </div>
                );
            }

            // ─── FORM HELPERS ───────────────────────────────────────
            function GlassField({ label, error, children }) {
                return (
                    <div style={{ marginBottom: 20 }}>
                        <label
                            style={{
                                display: "block",
                                fontSize: 13,
                                fontWeight: 600,
                                color: "var(--fg)",
                                marginBottom: 6,
                            }}
                        >
                            {label}
                        </label>
                        {children}
                        {error && (
                            <p style={{ fontSize: 12, color: "var(--danger)", marginTop: 4 }}>
                                {error}
                            </p>
                        )}
                    </div>
                );
            }

            function GlassImageUpload({ preview, onFileChange, error }) {
                return (
                    <div>
                        <div
                            className="glass"
                            style={{
                                aspectRatio: "1",
                                borderRadius: "var(--radius)",
                                display: "flex",
                                alignItems: "center",
                                justifyContent: "center",
                                overflow: "hidden",
                                marginBottom: 12,
                                border: "2px dashed var(--glass-border)",
                            }}
                        >
                            {preview ? (
                                <img
                                    src={preview}
                                    alt="Preview"
                                    style={{ width: "100%", height: "100%", objectFit: "cover" }}
                                />
                            ) : (
                                <div style={{ textAlign: "center", color: "var(--muted-fg)" }}>
                                    <span
                                        style={{ opacity: 0.4, display: "block", marginBottom: 6 }}
                                    >
                                        {I.photo}
                                    </span>
                                    <span style={{ fontSize: 13 }}>Belum ada gambar</span>
                                </div>
                            )}
                        </div>
                        <input
                            type="file"
                            accept="image/*"
                            onChange={onFileChange}
                            style={{
                                display: "block",
                                width: "100%",
                                fontSize: 13,
                                color: "var(--muted-fg)",
                                cursor: "pointer",
                            }}
                        />
                        {error && (
                            <p style={{ fontSize: 12, color: "var(--danger)", marginTop: 4 }}>
                                {error}
                            </p>
                        )}
                    </div>
                );
            }

            function ShowForm({ data, onDataChange, onBack, mode, cat }) {
                const [saving, setSaving] = useState(false);
                const handleSubmit = (e) => {
                    e.preventDefault();
                    setSaving(true);
                    setTimeout(() => setSaving(false), 1500);
                };

                const baseInput = (hasError) => ({
                    width: "100%",
                    padding: "11px 16px",
                    borderRadius: "var(--radius)",
                    border: `1px solid ${hasError ? "var(--danger)" : "var(--glass-border)"}`,
                    background: "var(--input-bg)",
                    backdropFilter: "blur(8px)",
                    color: "var(--fg)",
                    fontSize: 14,
                    outline: "none",
                    transition: "border 0.2s",
                });

                return (
                    <div>
                        <div style={{ marginBottom: 24 }}>
                            <button
                                onClick={onBack}
                                style={{
                                    display: "inline-flex",
                                    alignItems: "center",
                                    gap: 6,
                                    color: "var(--muted-fg)",
                                    fontSize: 13,
                                    cursor: "pointer",
                                    background: "none",
                                    border: "none",
                                    padding: 0,
                                    marginBottom: 8,
                                }}
                            >
                                {I.back} Kembali ke Kategori
                            </button>
                            <h1
                                style={{
                                    fontSize: 24,
                                    fontWeight: 600,
                                    color: "var(--fg)",
                                    letterSpacing: "-0.3px",
                                }}
                            >
                                {mode === "create" ? "Tambah Kategori Baru" : "Edit Kategori"}
                            </h1>
                            {mode === "edit" && (
                                <p style={{ fontSize: 14, color: "var(--muted-fg)", marginTop: 4 }}>
                                    {cat?.name}
                                </p>
                            )}
                        </div>

                        <form onSubmit={handleSubmit} encType="multipart/form-data">
                            <div
                                style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 24 }}
                            >
                                <div
                                    className="glass"
                                    style={{ borderRadius: "var(--radius)", padding: 22 }}
                                >
                                    <GlassField label="Gambar Kategori">
                                        <GlassImageUpload
                                            preview={data.preview}
                                            onFileChange={data.onFile}
                                        />
                                    </GlassField>
                                </div>
                                <div
                                    className="glass"
                                    style={{ borderRadius: "var(--radius)", padding: 22 }}
                                >
                                    <GlassField label="Nama Kategori">
                                        <input
                                            type="text"
                                            value={data.name}
                                            onChange={(e) => onDataChange("name", e.target.value)}
                                            placeholder="Masukkan nama kategori"
                                            style={baseInput()}
                                        />
                                    </GlassField>
                                    <GlassField label="Deskripsi">
                                        <textarea
                                            value={data.desc}
                                            onChange={(e) => onDataChange("desc", e.target.value)}
                                            placeholder="Deskripsi kategori (opsional)"
                                            style={{
                                                ...baseInput(),
                                                resize: "vertical",
                                                minHeight: 80,
                                            }}
                                        />
                                    </GlassField>
                                    <div
                                        style={{
                                            display: "flex",
                                            justifyContent: "flex-end",
                                            gap: 12,
                                            marginTop: 8,
                                        }}
                                    >
                                        <button
                                            type="button"
                                            onClick={onBack}
                                            className="glass"
                                            style={{
                                                padding: "10px 24px",
                                                borderRadius: "var(--radius)",
                                                color: "var(--muted-fg)",
                                                fontSize: 14,
                                                fontWeight: 500,
                                                cursor: "pointer",
                                                border: "1px solid var(--glass-border)",
                                            }}
                                        >
                                            Batal
                                        </button>
                                        <button
                                            type="submit"
                                            disabled={saving}
                                            className="glass"
                                            style={{
                                                display: "inline-flex",
                                                alignItems: "center",
                                                gap: 8,
                                                padding: "10px 24px",
                                                borderRadius: "var(--radius)",
                                                background: "rgba(67, 127, 236, 0.2)",
                                                backdropFilter: "blur(8px)",
                                                color: "var(--primary)",
                                                border: "1px solid rgba(67, 127, 236, 0.2)",
                                                fontSize: 14,
                                                fontWeight: 600,
                                                cursor: "pointer",
                                                opacity: saving ? 0.7 : 1,
                                            }}
                                        >
                                            {I.save}{" "}
                                            {saving
                                                ? "Menyimpan..."
                                                : mode === "create"
                                                  ? "Simpan Kategori"
                                                  : "Simpan Perubahan"}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                );
            }

            // ─── CREATE ─────────────────────────────────────────────
            function CreatePage({ onBack }) {
                const [name, setName] = useState("");
                const [desc, setDesc] = useState("");
                const [preview, setPreview] = useState(null);
                const handleFile = (e) => {
                    const f = e.target.files?.[0];
                    if (f) setPreview(URL.createObjectURL(f));
                };

                return (
                    <ShowForm
                        mode="create"
                        onBack={onBack}
                        data={{ name, desc, preview, onFile: handleFile }}
                        onDataChange={(field, val) => {
                            if (field === "name") setName(val);
                            if (field === "desc") setDesc(val);
                        }}
                    />
                );
            }

            // ─── EDIT ───────────────────────────────────────────────
            function EditPage({ onBack }) {
                const cat = CATEGORIES[0];
                const [name, setName] = useState(cat.name);
                const [desc, setDesc] = useState(cat.desc);
                const [preview, setPreview] = useState(cat.image);
                const handleFile = (e) => {
                    const f = e.target.files?.[0];
                    if (f) setPreview(URL.createObjectURL(f));
                };

                return (
                    <ShowForm
                        mode="edit"
                        onBack={onBack}
                        cat={cat}
                        data={{ name, desc, preview, onFile: handleFile }}
                        onDataChange={(field, val) => {
                            if (field === "name") setName(val);
                            if (field === "desc") setDesc(val);
                        }}
                    />
                );
            }

            // ─── APP ────────────────────────────────────────────────
            function App() {
                const [theme, toggleTheme] = useTheme();
                const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
                const [page, setPage] = useState("index");

                useEffect(() => {
                    document.documentElement.setAttribute("data-theme", theme);
                }, [theme]);

                const bgGrad =
                    theme === "dark"
                        ? "radial-gradient(ellipse at 20% 20%, oklch(0.2 0.06 262.881), oklch(0.08 0.02 275) 60%, oklch(0.05 0.01 285) 100%)"
                        : "radial-gradient(ellipse at 20% 20%, oklch(0.97 0.005 262.881), oklch(0.95 0.005 270) 80%)";

                return (
                    <div
                        style={{
                            display: "flex",
                            height: "100vh",
                            position: "relative",
                            background: bgGrad,
                            transition: "background 0.5s",
                        }}
                    >
                        <AmbientOrbs />
                        <Sidebar
                            collapsed={sidebarCollapsed}
                            onToggle={() => setSidebarCollapsed((c) => !c)}
                            theme={theme}
                            onThemeToggle={toggleTheme}
                        />
                        <main
                            style={{
                                flex: 1,
                                overflow: "auto",
                                padding: "28px 32px",
                                position: "relative",
                                zIndex: 1,
                            }}
                        >
                            {page === "index" && <IndexPage onAdd={() => setPage("create")} />}
                            {page === "create" && <CreatePage onBack={() => setPage("index")} />}
                            {page === "edit" && <EditPage onBack={() => setPage("index")} />}
                        </main>
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById("root"));
            root.render(<App />);
        </script>
    </body>
</html>
