        <!--
  DESIGNER'S NOTES — Direction #1: Nordic Structure
  Philosophy: Pentagram Information Architecture
  Designer/Studio reference: Pentagram (Michael Bierut, Paula Scher, etc.)
  
  KEY ASSUMPTIONS:
  1. The existing brand primary (oklch 0.546 0.245 262.881 / blue) is used deliberately as an accent
     — buttons, active nav state, selection highlights. Not the dominant visual.
  2. Cards with light bg + thin 1px border provide structure without visual weight.
  3. Typography hierarchy: Plus Jakarta Sans Medium for headings, regular for body.
  4. Sidebar uses a darker tone (oklch 0.13) in dark mode, near-white in light mode.
  5. All three pages (Index, Create, Edit) follow the same card/panel grammar.
  6. Data is placeholder until connected to real backend.
  
  WHY THIS WORKS FOR RTOS:
  - An e-commerce admin panel needs clarity and trust. Nordic structure communicates
    reliability without feeling cold.
  - The blue primary is warm enough (263° hue) to feel approachable.
  - Generous whitespace gives breathing room for inventory-heavy workflows.
  
  PLACEHOLDERS:
  - Category images use Unsplash sourced URLs (external, will 404 offline)
  - Search and pagination are visual-only
  - Form submission is not functional
-->

                --primary-fg: #fff;
                --primary-subtle: oklch(0.68 0.17 262.881);
                --primary-subtle-fg: oklch(0.95 0.03 262.881);
                --danger: oklch(0.6 0.2 25);
                --success: oklch(0.6 0.18 145);

                --bg: oklch(1 0 0);
                --fg: oklch(0.181 0.005 285.823);
                --muted-bg: oklch(0.967 0.001 286.375);
                --muted-fg: oklch(0.55 0.015 285.823);
                --border: oklch(0.922 0.004 286.375);
                --sidebar-bg: oklch(0.98 0 0);
                --sidebar-fg: oklch(0.181 0.005 285.823);
                --sidebar-border: oklch(0.922 0.004 286.375);
                --card-bg: #fff;
                --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
                --radius: 12px;
                --radius-sm: 8px;
            }

            [data-theme="dark"] {
                --bg: oklch(0.181 0.005 285.823);
                --fg: oklch(1 0 0);
                --muted-bg: oklch(0.256 0.008 285.823);
                --muted-fg: oklch(0.6 0.01 285.823);
                --border: oklch(0.25 0.005 285.823);
                --sidebar-bg: oklch(0.13 0.004 285.82);
                --sidebar-fg: oklch(0.9 0.005 285.823);
                --sidebar-border: oklch(0.2 0.005 285.823);
                --card-bg: oklch(0.2 0.005 285.823);
                --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
            }

            html {
                font-family: "Plus Jakarta Sans", "Inter", ui-sans-serif, system-ui, sans-serif;
                color: var(--fg);
                background: var(--muted-bg);
            }
            body {
                margin: 0;
                overflow: hidden;
                height: 100vh;
            }
            #root {
                height: 100vh;
                display: flex;
            }

            ::-webkit-scrollbar {
                width: 6px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            ::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 3px;
            }

            input,
            textarea,
            button {
                font-family: inherit;
            }
        </style>

            function useTheme() {
                const [theme, setTheme] = useState(() => {
                    const stored = localStorage.getItem("nordic-theme");
                    return stored || "light";
                });
                const toggle = useCallback(() => {
                    setTheme((t) => {

                        localStorage.setItem("nordic-theme", next);
                        return next;
                    });
                }, []);
                return [theme, toggle];

                    justifyContent: "center",
                    gap: 6,
                    marginTop: 24,
                    paddingTop: 20,
                    borderTop: "1px solid var(--border)",
                };
                const btn = (active) => ({
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    minWidth: 34,
                    height: 34,
                    borderRadius: "var(--radius-sm)",
                    border: active ? "none" : "1px solid var(--border)",
                    background: active ? "var(--primary)" : "transparent",
                    color: active ? "#fff" : "var(--fg)",
                    fontSize: 13,
                    fontWeight: active ? 600 : 400,
                    cursor: "pointer",
                    padding: "0 10px",
                    transition: "background 0.15s",
                });
                const info = {
                    fontSize: 13,
                    color: "var(--muted-fg)",
                    margin: "0 12px",
                };
                return (
                    <div style={wrap}>
                        <button style={btn(false)}>{Icons.chevronLeft} Sebelumnya</button>
                        {[1, 2, 3].map((n) => (
                            <button key={n} style={btn(n === current)}>
                                {n}
                            </button>
                        ))}
                        <span style={info}>menampilkan 1-8 dari 8 kategori</span>
                        <button style={btn(false)}>Selanjutnya {Icons.chevronRight}</button>
                    </div>
                );
            }

            // ─── INDEX PAGE ─────────────────────────────────────────
            function IndexPage({ onAdd }) {
                const [search, setSearch] = useState("");
                const [view, setView] = useState("grid");

                const filtered = CATEGORIES.filter((c) =>
                    c.name.toLowerCase().includes(search.toLowerCase()),
                );

                const gridStyle = {
                    display: "grid",
                    gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))",
                    gap: 16,
                };
                const listStyle = {
                    display: "flex",
                    flexDirection: "column",
                    gap: 8,
                };
                const countBadge = {
                    fontSize: 13,
                    color: "var(--muted-fg)",
                    marginBottom: 16,
                };

                return (
                    <div>
                        <PageHeader title="Kategori" onAdd={onAdd} />
                        <SearchBar
                            value={search}
                            onChange={(e) => setSearch(e.target.value)}
                            viewMode={view}
                            onViewChange={setView}
                        />
                        <div style={countBadge}>{filtered.length} kategori</div>
                        <div style={view === "grid" ? gridStyle : listStyle}>
                            {filtered.map((cat) => (
                                <CategoryCard key={cat.id} cat={cat} viewMode={view} />
                            ))}
                        </div>
                        <Pagination current={1} total={3} />
                    </div>
                );
            }

            // ─── FORM COMPONENTS ────────────────────────────────────
            function FormField({ label, error, children }) {
                const wrap = { marginBottom: 20 };
                const lbl = {
                    display: "block",
                    fontSize: 13,
                    fontWeight: 600,
                    color: "var(--fg)",
                    marginBottom: 6,
                };
                const err = { fontSize: 12, color: "var(--danger)", marginTop: 4 };
                return (
                    <div style={wrap}>
                        <label style={lbl}>{label}</label>
                        {children}
                        {error && <p style={err}>{error}</p>}
                    </div>
                );
            }

            function ImageUpload({ preview, onFileChange, error }) {
                const box = {
                    aspectRatio: "1",
                    borderRadius: "var(--radius)",
                    background: "var(--muted-bg)",
                    border: "2px dashed var(--border)",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    overflow: "hidden",
                    marginBottom: 12,
                };
                const placeholder = { textAlign: "center", color: "var(--muted-fg)" };
                const inputStyle = {
                    display: "block",
                    width: "100%",
                    fontSize: 13,
                    color: "var(--muted-fg)",
                    cursor: "pointer",
                };
                const inputFile = {
                    ...inputStyle,
                };

                return (
                    <div>
                        <div style={box}>
                            {preview ? (
                                <img
                                    src={preview}
                                    alt="Preview"
                                    style={{ width: "100%", height: "100%", objectFit: "cover" }}
                                />
                            ) : (
                                <div style={placeholder}>
                                    <span
                                        style={{ opacity: 0.4, display: "block", marginBottom: 6 }}
                                    >
                                        {Icons.photo}
                                    </span>
                                    <span style={{ fontSize: 13 }}>Belum ada gambar</span>
                                </div>
                            )}
                        </div>
                        <input
                            type="file"
                            accept="image/*"
                            onChange={onFileChange}
                            style={inputFile}
                        />
                        {error && (
                            <p style={{ fontSize: 12, color: "var(--danger)", marginTop: 4 }}>
                                {error}
                            </p>
                        )}
                    </div>
                );
            }

            // ─── CREATE PAGE ────────────────────────────────────────
            function CreatePage({ onBack }) {
                const [name, setName] = useState("");
                const [desc, setDesc] = useState("");
                const [preview, setPreview] = useState(null);
                const [errors, setErrors] = useState({});
                const [saving, setSaving] = useState(false);

                const handleFile = (e) => {
                    const file = e.target.files?.[0];
                    if (file) setPreview(URL.createObjectURL(file));
                };

                // Assumption: form is visual-only for prototype
                const handleSubmit = (e) => {
                    e.preventDefault();
                    setSaving(true);
                    setTimeout(() => setSaving(false), 1500);
                };

                const inputStyle = (hasError) => ({
                    width: "100%",
                    padding: "10px 14px",
                    borderRadius: "var(--radius)",
                    border: `1px solid ${hasError ? "var(--danger)" : "var(--border)"}`,
                    background: "var(--card-bg)",
                    color: "var(--fg)",
                    fontSize: 14,
                    outline: "none",
                    transition: "border-color 0.15s",
                });

                const textareaStyle = { ...inputStyle(false), resize: "vertical", minHeight: 80 };

                return (
                    <div>
                        <div style={{ marginBottom: 24 }}>
                            <button
                                onClick={onBack}
                                style={{
                                    display: "inline-flex",
                                    alignItems: "center",
                                    gap: 6,
                                    color: "var(--muted-fg)",
                                    fontSize: 13,
                                    cursor: "pointer",
                                    background: "none",
                                    border: "none",
                                    padding: 0,
                                    marginBottom: 8,
                                    transition: "color 0.15s",
                                }}
                            >
                                {Icons.back} Kembali ke Kategori
                            </button>
                            <h1
                                style={{
                                    fontSize: 22,
                                    fontWeight: 600,
                                    color: "var(--fg)",
                                    letterSpacing: "-0.3px",
                                }}
                            >
                                Tambah Kategori Baru
                            </h1>
                        </div>

                        <form onSubmit={handleSubmit} encType="multipart/form-data">
                            <div
                                style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 24 }}
                            >
                                {/* Image */}
                                <div
                                    style={{
                                        background: "var(--card-bg)",
                                        borderRadius: "var(--radius)",
                                        border: "1px solid var(--border)",
                                        boxShadow: "var(--card-shadow)",
                                        padding: 20,
                                    }}
                                >
                                    <FormField label="Gambar Kategori" error={errors.image}>
                                        <ImageUpload
                                            preview={preview}
                                            onFileChange={handleFile}
                                            error={errors.image}
                                        />
                                    </FormField>
                                </div>

                                {/* Fields */}
                                <div
                                    style={{
                                        background: "var(--card-bg)",
                                        borderRadius: "var(--radius)",
                                        border: "1px solid var(--border)",
                                        boxShadow: "var(--card-shadow)",
                                        padding: 20,
                                    }}
                                >
                                    <FormField label="Nama Kategori" error={errors.name}>
                                        <input
                                            type="text"
                                            value={name}
                                            onChange={(e) => setName(e.target.value)}
                                            placeholder="Masukkan nama kategori"
                                            style={inputStyle(!!errors.name)}
                                        />
                                    </FormField>
                                    <FormField label="Deskripsi" error={errors.description}>
                                        <textarea
                                            value={desc}
                                            onChange={(e) => setDesc(e.target.value)}
                                            placeholder="Deskripsi kategori (opsional)"
                                            style={textareaStyle}
                                        />
                                    </FormField>
                                    <div
                                        style={{
                                            display: "flex",
                                            justifyContent: "flex-end",
                                            gap: 12,
                                            marginTop: 8,
                                        }}
                                    >
                                        <button
                                            type="button"
                                            onClick={onBack}
                                            style={{
                                                padding: "10px 24px",
                                                borderRadius: "var(--radius)",
                                                border: "1px solid var(--border)",
                                                color: "var(--muted-fg)",
                                                fontSize: 14,
                                                fontWeight: 500,
                                                cursor: "pointer",
                                                background: "transparent",
                                                transition: "background 0.15s",
                                            }}
                                        >
                                            Batal
                                        </button>
                                        <button
                                            type="submit"
                                            disabled={saving}
                                            style={{
                                                display: "inline-flex",
                                                alignItems: "center",
                                                gap: 8,
                                                padding: "10px 24px",
                                                borderRadius: "var(--radius)",
                                                background: "var(--primary)",
                                                color: "#fff",
                                                border: "none",
                                                fontSize: 14,
                                                fontWeight: 600,
                                                cursor: "pointer",
                                                opacity: saving ? 0.7 : 1,
                                                transition: "opacity 0.15s",
                                            }}
                                        >
                                            {Icons.save}{" "}
                                            {saving ? "Menyimpan..." : "Simpan Kategori"}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                );
            }

            // ─── EDIT PAGE ──────────────────────────────────────────
            function EditPage({ onBack }) {
                const cat = CATEGORIES[0]; // Edit first category as demo
                const [name, setName] = useState(cat.name);
                const [desc, setDesc] = useState(cat.desc);
                const [preview, setPreview] = useState(cat.image);
                const [errors, setErrors] = useState({});
                const [saving, setSaving] = useState(false);

                const handleFile = (e) => {
                    const file = e.target.files?.[0];
                    if (file) setPreview(URL.createObjectURL(file));
                };

                const handleSubmit = (e) => {
                    e.preventDefault();
                    setSaving(true);
                    setTimeout(() => setSaving(false), 1500);
                };

                const inputStyle = (hasError) => ({
                    width: "100%",
                    padding: "10px 14px",
                    borderRadius: "var(--radius)",
                    border: `1px solid ${hasError ? "var(--danger)" : "var(--border)"}`,
                    background: "var(--card-bg)",
                    color: "var(--fg)",
                    fontSize: 14,
                    outline: "none",
                    transition: "border-color 0.15s",
                });

                const textareaStyle = { ...inputStyle(false), resize: "vertical", minHeight: 80 };

                return (
                    <div>
                        <div style={{ marginBottom: 24 }}>
                            <button
                                onClick={onBack}
                                style={{
                                    display: "inline-flex",
                                    alignItems: "center",
                                    gap: 6,
                                    color: "var(--muted-fg)",
                                    fontSize: 13,
                                    cursor: "pointer",
                                    background: "none",
                                    border: "none",
                                    padding: 0,
                                    marginBottom: 8,
                                    transition: "color 0.15s",
                                }}
                            >
                                {Icons.back} Kembali ke Kategori
                            </button>
                            <h1
                                style={{
                                    fontSize: 22,
                                    fontWeight: 600,
                                    color: "var(--fg)",
                                    letterSpacing: "-0.3px",
                                }}
                            >
                                Edit Kategori
                            </h1>
                            <p style={{ fontSize: 14, color: "var(--muted-fg)", marginTop: 4 }}>
                                {cat.name}
                            </p>
                        </div>

                        <form onSubmit={handleSubmit} encType="multipart/form-data">
                            <div
                                style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 24 }}
                            >
                                <div
                                    style={{
                                        background: "var(--card-bg)",
                                        borderRadius: "var(--radius)",
                                        border: "1px solid var(--border)",
                                        boxShadow: "var(--card-shadow)",
                                        padding: 20,
                                    }}
                                >
                                    <FormField label="Gambar Kategori" error={errors.image}>
                                        <ImageUpload
                                            preview={preview}
                                            onFileChange={handleFile}
                                            error={errors.image}
                                        />
                                    </FormField>
                                </div>
                                <div
                                    style={{
                                        background: "var(--card-bg)",
                                        borderRadius: "var(--radius)",
                                        border: "1px solid var(--border)",
                                        boxShadow: "var(--card-shadow)",
                                        padding: 20,
                                    }}
                                >
                                    <FormField label="Nama Kategori" error={errors.name}>
                                        <input
                                            type="text"
                                            value={name}
                                            onChange={(e) => setName(e.target.value)}
                                            placeholder="Nama kategori"
                                            style={inputStyle(!!errors.name)}
                                        />
                                    </FormField>
                                    <FormField label="Deskripsi" error={errors.description}>
                                        <textarea
                                            value={desc}
                                            onChange={(e) => setDesc(e.target.value)}
                                            placeholder="Deskripsi kategori"
                                            style={textareaStyle}
                                        />
                                    </FormField>
                                    <div
                                        style={{
                                            display: "flex",
                                            justifyContent: "flex-end",
                                            gap: 12,
                                            marginTop: 8,
                                        }}
                                    >
                                        <button
                                            type="button"
                                            onClick={onBack}
                                            style={{
                                                padding: "10px 24px",
                                                borderRadius: "var(--radius)",
                                                border: "1px solid var(--border)",
                                                color: "var(--muted-fg)",
                                                fontSize: 14,
                                                fontWeight: 500,
                                                cursor: "pointer",
                                                background: "transparent",
                                            }}
                                        >
                                            Batal
                                        </button>
                                        <button
                                            type="submit"
                                            disabled={saving}
                                            style={{
                                                display: "inline-flex",
                                                alignItems: "center",
                                                gap: 8,
                                                padding: "10px 24px",
                                                borderRadius: "var(--radius)",
                                                background: "var(--primary)",
                                                color: "#fff",
                                                border: "none",
                                                fontSize: 14,
                                                fontWeight: 600,
                                                cursor: "pointer",
                                                opacity: saving ? 0.7 : 1,
                                            }}
                                        >
                                            {Icons.save}{" "}
                                            {saving ? "Menyimpan..." : "Simpan Perubahan"}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                );
            }

            // ─── APP ────────────────────────────────────────────────
            function App() {
                const [theme, toggleTheme] = useTheme();
                const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
                const [page, setPage] = useState("index");

                React.useEffect(() => {
                    document.documentElement.setAttribute("data-theme", theme);
                }, [theme]);

                const mainStyle = {
                    flex: 1,
                    overflow: "auto",
                    padding: "28px 32px",
                    background: "var(--bg)",
                };

                return (
                    <>
                        <Sidebar
                            collapsed={sidebarCollapsed}
                            onToggle={() => setSidebarCollapsed((c) => !c)}
                            theme={theme}
                            onThemeToggle={toggleTheme}
                            activePage={page}
                            onPageChange={setPage}
                        />
                        <main style={mainStyle}>
                            {page === "index" && <IndexPage onAdd={() => setPage("create")} />}
                            {page === "create" && <CreatePage onBack={() => setPage("index")} />}
                            {page === "edit" && <EditPage onBack={() => setPage("index")} />}
                        </main>
                    </>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById("root"));
            root.render(<App />);
        </script>
    </body>
</html>
